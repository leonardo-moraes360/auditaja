<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Conteúdo indisponível por razão legal — Auditaja</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header role="banner">
    <span class="visually-hidden">Auditaja</span>
  </header>

  <main role="main" aria-labelledby="titulo-pagina">
    <div class="container">
      <div class="icon" aria-hidden="true">⚖️</div>
      <h1 id="titulo-pagina">Conteúdo indisponível por razão legal</h1>

      <div class="card judicial" role="alert">
        <p class="mensagem">
          O acesso a este conteúdo foi suspenso em cumprimento a uma determinação legal ou judicial.
        </p>

        <div class="detalhes">
          {{LINHA_AUTORIDADE}}
          {{LINHA_PROCESSO}}
          {{LINHA_DATA}}
        </div>
      </div>

      <div class="contato">
        {{LINHA_CONTATO}}
      </div>
    </div>
  </main>

  <footer role="contentinfo">
    <div class="footer-content">
      <p>Auditaja — Transparência e controle social</p>
    </div>
  </footer>
</body>
</html>
