<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Em manutenção — Auditaja</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    :root {
      --fundo: #f7f7f4;
      --superficie: #ffffff;
      --texto: #14171c;
      --texto-2: #3d424b;
      --texto-3: #555b66;
      --primaria: #1a44b8;
      --primaria-hover: #0b2a78;
      --link: #1a44b8;
      --link-hover: #0b2a78;
      --borda: #e2e2dc;
      --azul-bandeira: #002776;
      --verde-bandeira: #009c3b;
      --amarelo-bandeira: #ffdf00;
      --rodape-fundo: #15181e;
      --rodape-texto: #d5d7dc;
      --rodape-link: #a9bef5;
      --atipico: #6b4b00;
      --atipico-fundo: #fff6d6;
      --atipico-borda: #8a6100;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --fundo: #0e1424;
        --superficie: #161d30;
        --texto: #eceef2;
        --texto-2: #c3c8d2;
        --texto-3: #9aa2b1;
        --primaria: #7fa2ff;
        --primaria-hover: #a9c1ff;
        --link: #9db8ff;
        --link-hover: #c2cbf2;
        --borda: #2a3349;
        --azul-bandeira: #4f74d9;
        --rodape-fundo: #0a0f1c;
        --rodape-link: #c2cbf2;
        --atipico: #ffd966;
        --atipico-fundo: #2b2410;
        --atipico-borda: #c9a227;
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--fundo);
      color: var(--texto);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    a {
      color: var(--link);
      text-decoration: underline;
    }

    a:hover {
      color: var(--link-hover);
    }

    a:focus-visible {
      outline: 2px solid var(--primaria);
      outline-offset: 2px;
    }

    header {
      background: linear-gradient(
        to right,
        var(--verde-bandeira) 0%,
        var(--verde-bandeira) 33.33%,
        var(--amarelo-bandeira) 33.33%,
        var(--amarelo-bandeira) 66.66%,
        var(--azul-bandeira) 66.66%,
        var(--azul-bandeira) 100%
      );
      height: 4px;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 40rem;
      width: 100%;
      text-align: center;
    }

    .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.875rem;
      font-weight: 700;
      margin: 0 0 1rem 0;
      color: var(--texto);
    }

    .card {
      background-color: var(--atipico-fundo);
      border: 1px solid var(--borda);
      border-left: 4px solid var(--atipico-borda);
      border-radius: 0.625rem;
      padding: 2rem;
      margin-bottom: 1.5rem;
    }

    .mensagem {
      font-size: 1.125rem;
      color: var(--texto-2);
      margin: 0 0 1rem 0;
    }

    .detalhes {
      font-size: 0.875rem;
      color: var(--texto-3);
      margin: 1rem 0 0 0;
    }

    .detalhes p {
      margin: 0.5rem 0;
    }

    .contato {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--borda);
    }

    .contato p {
      margin: 0;
      font-size: 0.875rem;
      color: var(--texto-3);
    }

    footer {
      background-color: var(--rodape-fundo);
      color: var(--rodape-texto);
      padding: 1.5rem 1rem;
      text-align: center;
    }

    footer a {
      color: var(--rodape-link);
    }

    footer a:focus-visible {
      outline-color: #ffffff;
    }

    .footer-content {
      font-size: 0.875rem;
    }

    @media (min-width: 640px) {
      h1 {
        font-size: 2.25rem;
      }

      .card {
        padding: 2.5rem;
      }
    }
  </style>
</head>
<body>
  <header role="banner">
    <span class="visually-hidden">Auditaja</span>
  </header>

  <main role="main" aria-labelledby="titulo-pagina">
    <div class="container">
      <div class="icon" aria-hidden="true">🔧</div>
      <h1 id="titulo-pagina">Em manutenção</h1>

      <div class="card" role="status">
        <p class="mensagem">
          O Auditaja está temporariamente fora do ar para manutenção programada.
        </p>

        <div class="detalhes">
          <!-- PREVISAO_RETORNO: data/hora prevista para retorno (ex: "14/11/2026 às 18:00") -->
          <p><strong>Previsão de retorno:</strong> <!-- PREVISAO_RETORNO --></p>
          <!-- MOTIVO_MANUTENCAO: motivo breve (ex: "Atualização de infraestrutura") -->
          <p><strong>Motivo:</strong> <!-- MOTIVO_MANUTENCAO --></p>
        </div>
      </div>

      <div class="contato">
        <!-- CONTATO_EMAIL: e-mail de contato -->
        <p>Dúvidas? Entre em contato: <!-- CONTATO_EMAIL --></p>
      </div>
    </div>
  </main>

  <footer role="contentinfo">
    <div class="footer-content">
      <p>Auditaja — Transparência e controle social</p>
    </div>
  </footer>
</body>
</html>
