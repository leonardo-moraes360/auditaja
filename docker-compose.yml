services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auditaja
      POSTGRES_PASSWORD: auditaja
      POSTGRES_DB: auditaja
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - auditaja-pg:/var/lib/postgresql/data
      - ./packages/db/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditaja"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  auditaja-pg:
